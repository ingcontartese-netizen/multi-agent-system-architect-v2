name: Host compatibility
description: Report a host path, discovery, plugin, or runtime compatibility issue.
title: "[Host]: "
labels: [compatibility]
body:
  - type: input
    id: host-version
    attributes:
      label: Host and exact version
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Tagged source or release asset
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Install path and steps
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - FAIL
        - INCONCLUSIVE
        - Documentation drift
    validations:
      required: true
  - type: textarea
    id: official-doc
    attributes:
      label: Current official documentation
      description: Include the URL and access date when reporting path or capability drift.
    validations:
      required: true

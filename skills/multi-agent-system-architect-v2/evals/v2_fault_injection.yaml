mutation_count: 32
public_white_box_mutation_pass_rule: 32/32 means every frozen mutant is injected, the affected deterministic test path is executed, and that
  test path kills the mutant. Merely proposing or generating a mutant is not a pass.
public_white_box_mutation_survivor_rule: Any surviving, unexecuted, invalid, timed-out or aborted mutant fails the non-compensatory gate.
public_white_box_mutation_timeout_or_abort: The affected mutant is NOT_KILLED and the 32/32 gate fails.

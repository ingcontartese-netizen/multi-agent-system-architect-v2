schema_version: "2.0"
compatibility:
  v1_root_lists_preserved: true
  v1_output_shape_preserved: true
  version_dispatch: "oneOf"
scope_decisions:
  - "no-system"
  - "deterministic-workflow"
  - "single-agent"
  - "multi-agent"
  - "privileged-procedure"
controls:
  - "no_system_handoff"
  - "deterministic_steps"
  - "isolated_workspace"
  - "builder_verifier"
  - "counterevidence"
  - "publish_gate"
  - "policy_gate"
  - "draft_commit_split"
  - "authenticated_approval"
  - "durable_state"
  - "idempotency_key"
  - "trigger_dedup"
  - "retry_policy"
  - "alerting"
  - "kill_switch"
  - "no_duplicate_side_effect"
  - "deny_default"
  - "privileged_procedure"
  - "semantic_payload_retention"
  - "schema_validation"
  - "no_vector_db"
  - "acl_filtering"
  - "hybrid_retrieval"
  - "reranking"
  - "citations"
  - "retrieval_eval"
  - "verified_deletion"
  - "index_rebuild"
  - "provenance_update"
  - "untrusted_input_boundary"
  - "prompt_injection_filter"
  - "stale_source_reverify"
  - "three_alternatives"
  - "sensitivity_analysis"
  - "exit_strategy"
  - "canonical_core"
  - "thin_host_adapters"
  - "byte_parity"
  - "behavior_parity"
  - "blind_verifier"
  - "invariant_checks"
  - "searchable_text"
  - "outline_links"
  - "print_render_qa"
  - "mono_agent_baseline"
  - "measurable_multi_agent_benefit"
  - "remove_unjustified_agents"
  - "approval_deadline"
  - "compensation"
  - "lease_heartbeat"
  - "structured_payload_audit"
  - "source_provenance"
  - "rollback"
blocked_actions:
  - "multi_agent_default"
  - "vector_db_default"
  - "auto_commit"
  - "duplicate_side_effect"
  - "root_full_access"
  - "open_egress"
  - "trust_retrieved_instructions"
  - "stale_catalog_decision"
  - "ranking_auto_winner"
  - "doctrine_fork"
  - "visual_only_qa"
  - "deploy_without_approval"
  - "self_approval"
  - "silent_delete"
  - "hidden_assumptions"
artifacts:
  - "scope_decision"
  - "workflow_spec"
  - "triage_decision"
  - "acceptance_plan"
  - "approval_request"
  - "run_manifest"
  - "threat_model"
  - "memory_policy"
  - "provenance_manifest"
  - "stack_adr"
  - "adapter_manifest"
  - "parity_report"
  - "verifier_report"
  - "report_envelope"
  - "evaluation_report"
v2:
  evaluation_lanes:
    - "SEALED_BEHAVIORAL"
    - "PUBLIC_WHITE_BOX"
    - "VERIFIER_SEALED"
  candidate_visibility:
    - "CANDIDATE_VISIBLE"
    - "EXCLUDED_FROM_SEALED_BEHAVIORAL"
  candidate_states:
    - "CANDIDATE_UNSCORED"
  scoring_states:
    - "BLOCKED_UNTIL_CANDIDATE_FREEZE_AND_REVEAL"
  oracle_visibility:
    - "VERIFIER_SEALED"
    - "VERIFIER_SEALED_NOT_PRESENT"
    - "PUBLIC_WHITE_BOX"
  classification:
    scope_decision:
      - "no-system"
      - "deterministic-workflow"
      - "single-agent"
      - "multi-agent"
      - "privileged-procedure"
    architecture_mode:
      - "A"
      - "B"
      - "C"
    autonomy_level:
      - "AU0"
      - "AU1"
      - "AU2"
      - "AU3"
      - "AU4"
      - "AU5"
    risk_class:
      - "R0"
      - "R1"
      - "R2"
      - "R3"
      - "R4"
      - "R5"
  hard_decision_keys:
    - "route"
    - "hard_gate"
    - "evidence_recovery"
  outcomes:
    - "PASS"
    - "FAIL"
    - "TIMEOUT"
    - "ABORTED"
    - "INVALID"
  passing_outcomes:
    - "PASS"
  failure_outcomes:
    - "FAIL"
    - "TIMEOUT"
    - "ABORTED"
    - "INVALID"
  evidence_levels:
    - "observed"
    - "source_verified"
    - "tool_verified"
    - "live_verified"
    - "human_baptized"
  fixture_evidence_levels:
    - "source_verified_synthetic_fixture"
    - "tool_verified_after_deterministic_replay"
    - "tool_verified"
  effect_classifications:
    - "NO_EFFECT"
    - "EFFECT_CONFIRMED"
    - "STATE_UNCERTAIN"
    - "NOT_APPLICABLE"
  fault_lanes:
    - "E1"
    - "E2"
    - "E3"
  mutation_lifecycle:
    - "INJECTED"
    - "EXECUTED"
    - "KILLED"
